name: Release

# Manual only. Bump the version in Cargo.toml first; this reads it rather than
# taking it as input, so the tag, the binary and the crate can never disagree.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: get
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing v$V"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: canopy-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: canopy-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: canopy-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: canopy-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/canopy canopy
          chmod +x canopy
          tar czf ${{ matrix.asset }}.tar.gz canopy
          rm canopy

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}.tar.gz
          path: ${{ matrix.asset }}.tar.gz

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: canopy v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Deliberately no npm and no Homebrew jobs.
#
# The inherited workflow published an npm package and pushed a formula to
# jsleemaster/homebrew-tap -- the UPSTREAM author's repository, which this fork
# has no business writing to. It also built binaries named `cltree`, which no
# longer exist, so it could only ever have failed.
#
# README documents `cargo install` as the install path and says a Homebrew tap
# waits for the first person who is not the author to ask for one. Add the job
# then, pointing at a tap that belongs to this account.
#
# Binaries here are unsigned and unnotarised, so a direct download hits
# Gatekeeper quarantine on macOS. That is documented in the README along with
# the `xattr -d` workaround.
